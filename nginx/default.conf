server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Logs
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Límites de subida
    client_max_body_size 100M;

    # Compatibilidad: en XAMPP el proyecto vive en /clientes.
    # En Docker servimos el repo como raíz (/), así que reescribimos /clientes/* -> /*
    # para evitar loops de redirección y 404 de assets/API.
    location ^~ /clientes/ {
        rewrite ^/clientes(/.*)$ $1 last;
    }

    # Configuración principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar archivos PHP
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        include fastcgi_params;
        
        # Timeouts
        fastcgi_read_timeout 300;
    }

    # Archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos de configuración
    location ~ \.(yml|yaml|conf|json|lock)$ {
        deny all;
    }
}

